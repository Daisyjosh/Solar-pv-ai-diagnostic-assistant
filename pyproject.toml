[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-pv-diagnostic-platform"
version = "0.1.0"
description = "AI-powered solar photovoltaic inspection, multi-modal diagnosis, and O&M decision support platform."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Solar PV AI Engineering Team" }
]
keywords = [
    "solar-pv",
    "photovoltaics",
    "thermography",
    "iec-62446-3",
    "fault-diagnosis",
    "operations-and-maintenance",
    "computer-vision"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "streamlit>=1.41.0",
    "numpy>=1.26.0",
    "pillow>=11.0.0",
    "opencv-python-headless>=4.10.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]
ignore = ["E501"]
